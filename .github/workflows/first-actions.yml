name: My First GitHub Actions

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    # Removed the matrix block because old versions like 3.8 and 3.9 
    # cannot be natively installed on Ubuntu 26.04 without breaking dependencies.

    steps:
    - uses: actions/checkout@v4

    # We skip setup-python and deadsnakes entirely and use your EC2 instance's native python
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip python3-pytest
        python3 -m pip install --upgrade pip --break-system-packages || true

    - name: Run tests
      run: |
        cd src
        python3 -m pytest addition.py
